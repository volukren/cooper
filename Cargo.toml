[package]
name = "cooper"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false }
keyring = "4.2.0"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "native-tls"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
rune = { git = "https://github.com/anomalyco/rune", rev = "d6715352fb0cb3ab3551853c3ba92a7995a9bce5", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d6715352fb0cb3ab3551853c3ba92a7995a9bce5" }
rusqlite = { version = "0.42.0", features = ["bundled", "column_decltype", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
tokio-postgres = "0.7.18"
toml_edit = { version = "0.25.19", features = ["serde"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "d6715352fb0cb3ab3551853c3ba92a7995a9bce5" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "d6715352fb0cb3ab3551853c3ba92a7995a9bce5" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d6715352fb0cb3ab3551853c3ba92a7995a9bce5" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "d6715352fb0cb3ab3551853c3ba92a7995a9bce5" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.rune]
opt-level = 2

[profile.dev.package.rune-kit]
opt-level = 2

[profile.dev.package.rune-staging]
opt-level = 2

[profile.dev.package.rune-taffy]
opt-level = 2

[profile.dev.package.rune-motion]
opt-level = 2

[profile.dev.package.rune-highlights]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.parley_engine]
opt-level = 2

[profile.dev.package.parley_data]
opt-level = 2

[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.icu_segmenter]
opt-level = 2

[profile.dev.package.icu_normalizer]
opt-level = 2

[profile.dev.package.icu_properties]
opt-level = 2

[profile.dev.package.icu_collections]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.image]
opt-level = 2
